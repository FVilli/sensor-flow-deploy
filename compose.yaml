services:
  rabbitmq:
    hostname: sensor-flow-rabbitmq
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    environment:
      RABBITMQ_DEFAULT_USER: sensor_flow
      RABBITMQ_DEFAULT_PASS: sensor_flow_dev
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  config-manager:
    build:
      context: .
      dockerfile: docker/config-manager.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./volumes/config:/data/config
    restart: unless-stopped

  queue-manager:
    build:
      context: .
      dockerfile: docker/queue-manager.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_started
    restart: unless-stopped

  raw-writer:
    build:
      context: .
      dockerfile: docker/raw-writer.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_started
      queue-manager:
        condition: service_started
    volumes:
      - ./volumes/raw:/data/raw
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    hostname: sensor-flow-postgres
    environment:
      POSTGRES_DB: sensor_flow
      POSTGRES_USER: sensor_flow
      POSTGRES_PASSWORD: sensor_flow_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_flow -d sensor_flow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-writer:
    build:
      context: .
      dockerfile: docker/db-writer.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-manager:
        condition: service_started
      queue-manager:
        condition: service_started
    volumes:
      - ./volumes/raw:/data/raw:ro
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/instance-overview.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: sensor_flow_admin_dev
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      SENSOR_FLOW_GRAFANA_DB_PASSWORD: sensor_flow_grafana_dev
    depends_on:
      postgres:
        condition: service_healthy
      db-writer:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  node-api:
    build:
      context: .
      dockerfile: docker/node-api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      config-manager:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  health-probe-system:
    build:
      context: .
      dockerfile: docker/health-probe-system.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_started
    volumes:
      - ./volumes/raw:/data/raw:ro
      - ./volumes/config:/data/config:ro
    restart: unless-stopped

  mqtt-ingress-relay:
    build:
      context: .
      dockerfile: docker/mqtt-relay.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_started
    restart: unless-stopped

volumes:
  grafana-data:
  rabbitmq-data:
  postgres-data:
