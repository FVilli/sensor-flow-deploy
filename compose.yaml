services:

##############################################################################################
# VENDOR SERVICES
##############################################################################################

  rabbitmq:
    hostname: sensor-flow-rabbitmq
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    environment:
      RABBITMQ_DEFAULT_USER: sensor_flow
      RABBITMQ_DEFAULT_PASS: sensor_flow_dev
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/instance-overview.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: sensor_flow_admin_dev
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      SENSOR_FLOW_GRAFANA_DB_PASSWORD: sensor_flow_grafana_dev
    depends_on:
      postgres:
        condition: service_healthy
      db-writer:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    hostname: sensor-flow-postgres
    environment:
      POSTGRES_DB: sensor_flow
      POSTGRES_USER: sensor_flow
      POSTGRES_PASSWORD: sensor_flow_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_flow -d sensor_flow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

##############################################################################################
# PROJECT SERVICES
##############################################################################################

  config-manager:
    build:
      context: .
      dockerfile: docker/config-manager.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./volumes/config:/data/config
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sensor-flow-config-manager-ready"]
      interval: 2s
      timeout: 1s
      retries: 60
    restart: unless-stopped

  queue-manager:
    build:
      context: .
      dockerfile: docker/queue-manager.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_healthy
    restart: unless-stopped

  raw-writer:
    build:
      context: .
      dockerfile: docker/raw-writer.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_healthy
      queue-manager:
        condition: service_started
    volumes:
      - ./volumes/raw:/app/volumes/raw
    restart: unless-stopped

  db-writer-migrate:
    build:
      context: .
      dockerfile: docker/db-writer.Dockerfile
    command: ["node", "dist/apps/db-writer/apps/db-writer/src/main.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      config-manager:
        condition: service_healthy
    restart: "no"

  db-writer:
    build:
      context: .
      dockerfile: docker/db-writer.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-manager:
        condition: service_healthy
      queue-manager:
        condition: service_started
      db-writer-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sensor-flow-db-writer-ready"]
      interval: 2s
      timeout: 1s
      retries: 60
    volumes:
      - ./volumes/raw:/data/raw:ro
    restart: unless-stopped

# node-api, admin-api, health-probe-system, health-probe-rabbitmq,
# health-probe-postgres e health-agent sono implementati sotto apps/ ma restano
# esclusi dallo stack finché il verticale rimigrato non supera la verifica
# operativa host-local.

  mqtt-ingress-relay:
    build:
      context: .
      dockerfile: docker/mqtt-ingress-relay.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-manager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  grafana-data:
  rabbitmq-data:
  postgres-data:
